name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # every Monday

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v44.2.6
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          log-level: debug
